apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: expense-tracker-ingress
  namespace: expense-tracker

spec:
  ingressClassName: traefik

  rules:
  - host: expense.local

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: expense-tracker

            port:
              number: 8080
